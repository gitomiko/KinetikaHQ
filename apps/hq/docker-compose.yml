x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  hq-portal:
    <<: *common
    image: caddy:2.8-alpine
    container_name: hq-portal
    environment:
      COMFY_UPSTREAM: ${COMFY_UPSTREAM:-127.0.0.1:8188}
    ports:
      # TLS terminates at the gateway; only the HTTP origin is exposed.
      - "${TOOLS_BIND_IP:-0.0.0.0}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
