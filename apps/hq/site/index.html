<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetika HQ</title>
    <meta
      name="description"
      content="Kinetika HQ portal for homelab application launch and navigation."
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260630r" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=20260630r" />
    <link rel="shortcut icon" href="assets/favicon.ico?v=20260630r" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F5F1EB"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1C1C1B"
    />

    <!-- Kinetika Design System v2.5.0 — fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Syne:wght@400;500;700;800&family=DM+Mono:wght@300;400;500&display=swap">

    <link rel="stylesheet" href="assets/tokens.css?v=20260630r" />
    <link rel="stylesheet" href="styles.css?v=20260630r" />
    <script defer src="app.js?v=20260630r"></script>
  </head>
  <body>
    <main class="shell">
      <header class="chrome chrome-top">
        <button id="menuToggle" class="hamburger" type="button" aria-label="Open sections menu" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
        <span class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="chrome-brand" id="topBrand">kinetika hq · portal</span>
        <span class="chrome-right">
          <span class="chrome-status"><i class="dot dot-live"></i><span id="liveCount">0</span> live</span>
          <span id="hostLabel" class="chrome-host"></span>
          <button id="themeToggle" class="chrome-toggle" type="button">// dark</button>
        </span>
      </header>

      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <p class="brand-name" id="titleText">Kinetika HQ</p>
          <p class="brand-eyebrow" id="eyebrowText">KINETIKA CONTROL PLANE</p>
          <div class="brand-rule"></div>
        </div>

        <nav class="nav">
          <p class="nav-label">SECTIONS</p>
          <ul id="navList" class="nav-list" role="tablist"></ul>
        </nav>

        <div class="sidebar-overview">
          <p class="sidebar-overview-eyebrow">CURRENT VIEW</p>
          <p class="sidebar-overview-title" id="sidebarOverviewTitle">System Overview</p>
        </div>

        <label class="nav-search" for="searchInput">
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="$ search..."
          />
        </label>
      </aside>

      <section class="panel" aria-live="polite">
        <p class="panel-eyebrow" id="panelEyebrow">SECTION</p>
        <h2 class="panel-title" id="panelTitle">—</h2>
        <p class="panel-note" id="panelNote"></p>
        <div id="tiles" class="tiles"></div>
      </section>

      <footer class="chrome chrome-bot">
        <span class="chrome-left">
          <i class="dot dot-live"></i>
          <span>live</span>
          <span class="chrome-sep">·</span>
          <span id="modePill">HQ Portal</span>
        </span>
        <span class="chrome-center">
          <span id="clock" class="chrome-clock">--:--:--</span>
          <span class="chrome-sep">|</span>
          <span id="datePill" class="chrome-date">-- --- ----</span>
        </span>
        <span id="footerVersion" class="chrome-right-text">kinetika hq</span>
      </footer>
    </main>
  </body>
</html>
